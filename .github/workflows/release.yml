name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${version}" = "$GITHUB_REF_NAME"

  package:
    needs: verify-version
    name: Package (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: connectome-linux-x86_64
            archive: tar.gz
          - os: macos-13
            asset_name: connectome-macos-x86_64
            archive: tar.gz
          - os: macos-14
            asset_name: connectome-macos-aarch64
            archive: tar.gz
          - os: windows-latest
            asset_name: connectome-windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -C target/release -czf "dist/${{ matrix.asset_name }}.tar.gz" connectome
          shasum -a 256 "dist/${{ matrix.asset_name }}.tar.gz" > "dist/${{ matrix.asset_name }}.tar.gz.sha256"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/release/connectome.exe -DestinationPath "dist/${{ matrix.asset_name }}.zip"
          (Get-FileHash "dist/${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset_name }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.asset_name }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Connectome $GITHUB_REF_NAME" --generate-notes
