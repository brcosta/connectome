[package]
name = "connectome"
version = "0.1.0"
edition = "2021"
description = "Small, fast code intelligence MCP for Java and Clojure"
license = "MIT"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25.10"
tree-sitter-clojure = "0.1.0"
tree-sitter-java = "0.23.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
